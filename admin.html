<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal - Attendance System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-900 font-sans p-4">

  <div class="max-w-2xl mx-auto space-y-6">
    <div class="flex justify-between items-center border-b pb-3">
      <h1 class="text-xl font-bold">Admin Management</h1>
      <a href="index.html" class="text-xs bg-slate-800 text-white px-3 py-1.5 rounded font-semibold">Back to Home</a>
    </div>

    <!-- 1. INSTITUTION SETTINGS -->
    <div class="bg-white p-5 rounded-lg shadow border border-slate-200">
      <h2 class="text-base font-bold mb-3 border-b pb-1">1. College & Department Details</h2>
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600">College Name</label>
          <input type="text" id="cfg-college" class="w-full border p-2 rounded text-sm mt-1" placeholder="e.g. MADIN COLLEGE OF ENGINEERING">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600">Department Name</label>
          <input type="text" id="cfg-dept" class="w-full border p-2 rounded text-sm mt-1" placeholder="e.g. DEPARTMENT OF MECHANICAL ENGINEERING">
        </div>
        <button onclick="saveSettings()" id="btn-save-cfg" class="bg-blue-600 text-white px-4 py-2 rounded text-xs font-bold hover:bg-blue-700">
          Save Header Info
        </button>
      </div>
    </div>

    <!-- 2. CREATE STAFF ACCOUNTS -->
    <div class="bg-white p-5 rounded-lg shadow border border-slate-200">
      <h2 class="text-base font-bold mb-3 border-b pb-1">2. Create Staff / HOD Login</h2>
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600">Staff Full Name</label>
          <input type="text" id="staff-name" placeholder="e.g. Maneesh T" class="w-full border p-2 rounded text-sm mt-1">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600">Email Address</label>
          <input type="email" id="staff-email" placeholder="maneesh@college.edu" class="w-full border p-2 rounded text-sm mt-1">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-slate-600">Password</label>
            <input type="password" id="staff-pass" placeholder="Min. 6 characters" class="w-full border p-2 rounded text-sm mt-1">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600">Role</label>
            <select id="staff-role" class="w-full border p-2 rounded text-sm mt-1">
              <option value="STAFF">Staff</option>
              <option value="HOD">HOD</option>
              <option value="ADMIN">Admin</option>
            </select>
          </div>
        </div>
        <button onclick="createStaffAccount()" id="btn-create-staff" class="bg-purple-600 text-white px-4 py-2 rounded text-xs font-bold hover:bg-purple-700">
          Create Account
        </button>
      </div>
    </div>

    <!-- 3. CLASSES & SUBJECTS -->
    <div class="bg-white p-5 rounded-lg shadow border border-slate-200">
      <h2 class="text-base font-bold mb-3 border-b pb-1">3. Manage Classes & Subjects</h2>
      
      <!-- Class Add -->
      <label class="block text-xs font-semibold text-slate-600 mb-1">Add Class</label>
      <div class="flex gap-2 mb-4">
        <input type="text" id="new-class-name" placeholder="e.g. S4 ME A" class="flex-1 border p-2 rounded text-sm">
        <button onclick="addClass()" class="bg-emerald-600 text-white px-4 py-2 rounded text-xs font-bold hover:bg-emerald-700">Add Class</button>
      </div>

      <!-- Subject Add -->
      <label class="block text-xs font-semibold text-slate-600 mb-1">Add Subject</label>
      <div class="grid grid-cols-3 gap-2">
        <div>
          <input type="text" id="sub-code" placeholder="Code (e.g. MSM)" class="w-full border p-2 rounded text-sm">
        </div>
        <div class="col-span-2 flex gap-2">
          <input type="text" id="sub-name" placeholder="Subject Name" class="flex-1 border p-2 rounded text-sm">
          <button onclick="addSubject()" class="bg-indigo-600 text-white px-4 py-2 rounded text-xs font-bold hover:bg-indigo-700">Add</button>
        </div>
      </div>
    </div>

    <!-- 4. ALLOCATE SUBJECT & CLASS TO STAFF -->
    <div class="bg-white p-5 rounded-lg shadow border border-slate-200">
      <h2 class="text-base font-bold mb-3 border-b pb-1">4. Assign Subject to Staff</h2>
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600">Select Staff Member</label>
          <select id="alloc-staff" class="w-full border p-2 rounded text-sm mt-1"></select>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-slate-600">Select Class</label>
            <select id="alloc-class" class="w-full border p-2 rounded text-sm mt-1"></select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600">Select Subject</label>
            <select id="alloc-subject" class="w-full border p-2 rounded text-sm mt-1"></select>
          </div>
        </div>
        <button onclick="assignCourse()" class="bg-blue-600 text-white px-4 py-2 rounded text-xs font-bold hover:bg-blue-700">
          Assign Mapping
        </button>
        
        <div class="border-t pt-2 mt-3">
          <h3 class="text-xs font-bold text-slate-700 mb-1">Current Subject Allocations:</h3>
          <div id="alloc-list" class="divide-y border rounded text-xs max-h-36 overflow-y-auto bg-slate-50"></div>
        </div>
      </div>
    </div>

    <!-- 5. MANAGE STUDENTS -->
    <div class="bg-white p-5 rounded-lg shadow border border-slate-200">
      <h2 class="text-base font-bold mb-3 border-b pb-1">5. Manage Students</h2>
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600">Select Class</label>
          <select id="student-class-sel" class="w-full border p-2 rounded text-sm mt-1" onchange="loadStudentsList()">
            <option value="">-- Choose Class --</option>
          </select>
        </div>

        <div class="border border-blue-200 bg-blue-50/60 p-4 rounded-lg space-y-3">
          <div class="flex justify-between items-center">
            <span class="text-xs font-bold text-blue-900">Import Via Excel</span>
            <button onclick="downloadExcelTemplate()" class="bg-white border border-blue-400 text-blue-700 px-3 py-1 rounded text-xs font-semibold hover:bg-blue-100">
              📥 Download Excel Template
            </button>
          </div>
          <input type="file" id="excel-file-input" accept=".xlsx, .xls" class="block w-full text-xs text-slate-600 file:mr-3 file:py-1.5 file:px-3 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white cursor-pointer border rounded bg-white p-1">
          <button onclick="uploadExcel()" id="btn-upload-excel" class="w-full bg-emerald-600 text-white py-2 rounded text-xs font-bold hover:bg-emerald-700">
            Upload & Save Students
          </button>
        </div>

        <div class="border-t pt-2">
          <div class="flex justify-between items-center mb-1">
            <h3 class="text-xs font-bold text-slate-700">Class Roster:</h3>
            <span id="roster-count" class="text-[11px] text-slate-500">0 students</span>
          </div>
          <div id="roster-list" class="divide-y border rounded text-xs max-h-48 overflow-y-auto bg-slate-50"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://kpbyxgdgbizeipsacbqd.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtwYnl4Z2RnYml6ZWlwc2FjYnFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4OTgzNDksImV4cCI6MjEwNzQ3NDM0OX0.KgP4VSfPVpdxN4RsBScUC0IfxxTFtY5anKbB-OCG21s";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    document.addEventListener("DOMContentLoaded", async () => {
      await loadSettings();
      await refreshAllDropdowns();
      await loadAllocations();
    });

    async function loadSettings() {
      const { data } = await db.from("institution_settings").select("*").eq("id", 1).single();
      if (data) {
        document.getElementById("cfg-college").value = data.college_name || "";
        document.getElementById("cfg-dept").value = data.department_name || "";
      }
    }

    async function saveSettings() {
      const col = document.getElementById("cfg-college").value.trim();
      const dep = document.getElementById("cfg-dept").value.trim();
      const btn = document.getElementById("btn-save-cfg");
      btn.textContent = "Saving...";
      await db.from("institution_settings").update({ college_name: col, department_name: dep }).eq("id", 1);
      btn.textContent = "Saved!";
      setTimeout(() => btn.textContent = "Save Header Info", 2000);
    }

    async function createStaffAccount() {
      const name = document.getElementById("staff-name").value.trim();
      const email = document.getElementById("staff-email").value.trim();
      const password = document.getElementById("staff-pass").value;
      const role = document.getElementById("staff-role").value;
      const btn = document.getElementById("btn-create-staff");

      if (!name || !email || !password) return alert("Fill all staff details");
      btn.disabled = true;
      btn.textContent = "Creating...";

      const { error } = await db.auth.signUp({
        email, password,
        options: { data: { name, role } }
      });

      if (error) alert("Error: " + error.message);
      else {
        alert(`Account created for ${name}!`);
        document.getElementById("staff-name").value = "";
        document.getElementById("staff-email").value = "";
        document.getElementById("staff-pass").value = "";
        await refreshAllDropdowns();
      }
      btn.disabled = false;
      btn.textContent = "Create Account";
    }

    async function refreshAllDropdowns() {
      // Classes
      const { data: cls } = await db.from("classes").select("*").order("name");
      const cSel = document.getElementById("alloc-class");
      const stCSel = document.getElementById("student-class-sel");
      cSel.innerHTML = "";
      stCSel.innerHTML = '<option value="">-- Choose Class --</option>';
      (cls || []).forEach(c => {
        cSel.innerHTML += `<option value="${c.id}">${c.name}</option>`;
        stCSel.innerHTML += `<option value="${c.id}">${c.name}</option>`;
      });

      // Staff Profiles
      const { data: stf } = await db.from("profiles").select("*").order("name");
      const staffSel = document.getElementById("alloc-staff");
      staffSel.innerHTML = "";
      (stf || []).forEach(s => {
        staffSel.innerHTML += `<option value="${s.id}">${s.name} (${s.role})</option>`;
      });

      // Subjects
      const { data: subs } = await db.from("subjects").select("*").order("code");
      const subSel = document.getElementById("alloc-subject");
      subSel.innerHTML = "";
      (subs || []).forEach(sb => {
        subSel.innerHTML += `<option value="${sb.id}">${sb.code} - ${sb.name}</option>`;
      });
    }

    async function addClass() {
      const name = document.getElementById("new-class-name").value.trim();
      if (!name) return alert("Enter class name");
      await db.from("classes").insert({ name });
      document.getElementById("new-class-name").value = "";
      await refreshAllDropdowns();
    }

    async function addSubject() {
      const code = document.getElementById("sub-code").value.trim();
      const name = document.getElementById("sub-name").value.trim();
      if (!code || !name) return alert("Fill subject code and name");
      await db.from("subjects").insert({ code, name });
      document.getElementById("sub-code").value = "";
      document.getElementById("sub-name").value = "";
      await refreshAllDropdowns();
    }

    async function assignCourse() {
      const staffId = document.getElementById("alloc-staff").value;
      const classId = document.getElementById("alloc-class").value;
      const subjectId = document.getElementById("alloc-subject").value;

      if (!staffId || !classId || !subjectId) return alert("Select all 3 items");

      const { error } = await db.from("course_allocations").upsert({
        staff_id: staffId,
        class_id: classId,
        subject_id: subjectId
      }, { onConflict: "staff_id,subject_id,class_id" });

      if (error) alert("Error: " + error.message);
      else {
        alert("Assigned successfully!");
        await loadAllocations();
      }
    }

    async function loadAllocations() {
      const { data } = await db.from("course_allocations").select(`
        id,
        profiles ( name ),
        classes ( name ),
        subjects ( code )
      `);

      const list = document.getElementById("alloc-list");
      if (!data || data.length === 0) {
        list.innerHTML = '<div class="p-2 text-slate-400">No allocations yet</div>';
        return;
      }

      list.innerHTML = data.map(a => `
        <div class="p-2 flex justify-between items-center">
          <span><b>${a.profiles?.name}</b> → ${a.classes?.name}</span>
          <span class="bg-blue-100 text-blue-800 px-2 py-0.5 rounded font-bold">${a.subjects?.code}</span>
        </div>
      `).join("");
    }

    async function loadStudentsList() {
      const classId = document.getElementById("student-class-sel").value;
      const roster = document.getElementById("roster-list");
      const countLabel = document.getElementById("roster-count");

      if (!classId) {
        roster.innerHTML = "";
        countLabel.textContent = "0 students";
        return;
      }

      const { data } = await db.from("students").select("*").eq("class_id", classId).order("roll_no");
      countLabel.textContent = `${(data || []).length} students`;
      roster.innerHTML = (data || []).map(s => `
        <div class="p-2 flex justify-between">
          <span class="font-bold">${s.roll_no}</span>
          <span>${s.name}</span>
        </div>
      `).join("");
    }

    function downloadExcelTemplate() {
      const sampleData = [
        { "Roll No": "01", "Name": "Aravind Sharma" },
        { "Roll No": "02", "Name": "Diya Suresh" }
      ];
      const ws = XLSX.utils.json_to_sheet(sampleData);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Students");
      XLSX.writeFile(wb, "Student_Upload_Template.xlsx");
    }

    async function uploadExcel() {
      const classId = document.getElementById("student-class-sel").value;
      const fileInput = document.getElementById("excel-file-input");
      if (!classId) return alert("Select target class");
      if (!fileInput.files[0]) return alert("Select an Excel file");

      const reader = new FileReader();
      const btn = document.getElementById("btn-upload-excel");
      btn.disabled = true;
      btn.textContent = "Uploading...";

      reader.onload = async (e) => {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
          const records = [];

          for (let r of rows) {
            const roll = r["Roll No"] || r["RollNo"] || r["ROLL NO"];
            const name = r["Name"] || r["NAME"] || r["Student Name"];
            if (roll && name) {
              records.push({ class_id: classId, roll_no: String(roll).trim(), name: String(name).trim() });
            }
          }

          await db.from("students").upsert(records, { onConflict: 'class_id,roll_no' });
          alert(`Imported ${records.length} students!`);
          await loadStudentsList();
        } catch (err) {
          alert("Error: " + err.message);
        } finally {
          btn.disabled = false;
          btn.textContent = "Upload & Save Students";
        }
      };
      reader.readAsArrayBuffer(fileInput.files[0]);
    }
  </script>
</body>
</html>
